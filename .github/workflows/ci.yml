name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_models:
        description: Run large real-model browser and extension tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium chrome
      - run: npm run check
      - run: node scripts/release.mjs
      - run: unzip -t release/pianissimo-chrome-*.zip
      - if: inputs.real_models
        run: npm run models:download
      - if: inputs.real_models
        run: npm run test:real
      - if: inputs.real_models
        run: npm run test:extension:real
      - if: inputs.real_models
        run: npm run models:download -- --model=parakeet-tdt-v3
      - if: inputs.real_models
        run: npm run test:parakeet
      - if: inputs.real_models
        run: npm run test:parakeet:extension
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
